name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  semantic_pull_request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      includes: "**/*.md"
      modified_files_only: false

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.44.4"
      # The workspace root has no lib/test; format and analyze the whole repo.
      format_directories: "."
      analyze_directories: "."
      # Pub-workspace monorepo: run every package's suite from the root.
      test_recursion: true
      # The 100% Layer A/B coverage target is a tracked known gap (README
      # "Known gaps"); raise this once the gap closes.
      min_coverage: 0

